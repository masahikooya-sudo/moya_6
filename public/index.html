<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人情報チェック</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="main">
      <header>
        <h1>個人情報チェック</h1>
        <select id="pii-model-select" class="model-select"></select>
      </header>

      <div class="pii-content">
        <p class="pii-description">
          マスキング済みの <code>.xlsx</code> / <code>.pdf</code> ファイルをアップロードすると、
          正規表現によるパターンマッチングとAI(Gemma)の両方で個人情報が残っていないかを確認します。
        </p>

        <form id="pii-form" class="pii-form">
          <input type="file" id="pii-file" accept=".xlsx,.pdf" required />
          <button type="submit" id="pii-check-btn">チェックする</button>
        </form>

        <p class="pii-caveat">
          ※ このチェックは補助的なものです。100%の検出を保証するものではないため、
          結果によらず目視でも必ず確認してください。
        </p>

        <div id="pii-result" class="pii-result"></div>
      </div>
    </div>
  </div>

  <script src="pii.js"></script>
</body>
</html>
