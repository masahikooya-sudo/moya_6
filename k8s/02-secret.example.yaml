# これはテンプレートです。このファイルをそのまま `kubectl apply -f` しないでください。
#
# 推奨: 値を直接コマンドラインで渡して作成する(このファイルを編集してリポジトリに
# 秘密情報を残さないため)。
#
#   kubectl -n local-gemma-chat create secret generic app-secrets \
#     --from-literal=GOOGLE_CLIENT_ID='xxxxxxxx.apps.googleusercontent.com' \
#     --from-literal=GOOGLE_CLIENT_SECRET='xxxxxxxx' \
#     --from-literal=OAUTH2_PROXY_COOKIE_SECRET="$(python3 -c 'import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
#
# どうしてもYAMLで管理したい場合は、このファイルをコピーして値を埋めた上で
# .gitignore に追加してからapplyしてください(実ファイルはコミットしないこと)。
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: local-gemma-chat
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "xxxxxxxx.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "xxxxxxxx"
  OAUTH2_PROXY_COOKIE_SECRET: "xxxxxxxx"
