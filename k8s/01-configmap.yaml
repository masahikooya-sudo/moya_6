# 機密ではない設定値。実際の値は kubectl apply 前にこのファイルを編集するか、
# `kubectl -n local-gemma-chat edit configmap app-config` で変更してください。
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: local-gemma-chat
data:
  # docker-compose.yml と同様、Kubernetes Service名(ollama)で名前解決される
  OLLAMA_HOST: "http://ollama:11434"
  # アプリ全体で1つのモデルに固定(README参照)。CPUのみのノードでは軽量な e4b を既定にしている
  MODEL_NAME: "gemma4:e4b"
  PORT: "3000"
  # 個人情報チェックのAI呼び出し関連チューニング(README「Ollamaのチューニング」参照)
  OLLAMA_TIMEOUT_MS: "300000"
  OLLAMA_NUM_PREDICT: "500"
  PII_CHUNK_CHAR_LIMIT: "3000"
  PII_MAX_CHUNKS: "40"
  # アップロード監査ログ(README「アップロード監査ログ」参照)
  TZ: "Asia/Tokyo"
  PII_LOG_DIR: "/app/logs"
  PII_LOG_RETENTION_DAYS: "90"
  # ログインを許可する自社のGoogle Workspaceドメイン
  ALLOWED_EMAIL_DOMAIN: "example.co.jp"
  # 社員がアクセスするURLに合わせたコールバックURL
  OAUTH2_PROXY_REDIRECT_URL: "https://llm.internal.example.co.jp/oauth2/callback"
